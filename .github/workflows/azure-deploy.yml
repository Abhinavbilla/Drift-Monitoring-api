# Builds the Docker image and pushes it to the Azure Container Registry.
# The Azure Web App pulls :latest (continuous deployment restarts it on each push).
# Needs repository secrets ACR_USERNAME and ACR_PASSWORD (registry -> Access keys).
name: Build and push to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: driftsentinal.azurecr.io
  IMAGE: drift-monitoring
  # Public value (it ships in the frontend bundle), so it isn't a secret.
  VITE_GOOGLE_CLIENT_ID: 734414180053-ojfrbgppr7k35omsrud3jc34dldoff00.apps.googleusercontent.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VITE_GOOGLE_CLIENT_ID=${{ env.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
